name: ORCA-3DCT

description: >
  Training-free ORCA compression of 3D-CT tokens on the Merlin abdominal CT dataset: SuPreM and SegVol
  embeddings (ORCA and grid-average at several budgets), the uncompressed encoder grids, and TotalSegmentator
  organ masks on each encoder's token grid.

